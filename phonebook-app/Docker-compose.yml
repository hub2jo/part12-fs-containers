services:
  frontend:
    image: phonebook-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phonebook-frontend

  backend:
    image: phonebook-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://root:example@mongo:27017/phonebook?authSource=admin
    depends_on:
      - mongo
    container_name: phonebook-backend

  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data: